@if (loaded()) {
  <div class="punch" [class.is-in]="checkedIn()" [class.is-done]="doneForNow()">
    <span class="dot" [attr.aria-hidden]="true"></span>

    @if (checkedIn()) {
      <span class="readout">
        <span class="elapsed mono">{{ elapsed() }}</span>
        <span class="since">since {{ sinceLabel() }}</span>
      </span>
    } @else if (doneForNow()) {
      <!-- The day is finished, not unstarted: show what was banked and when
           it ended, so a second check-in is a deliberate act. -->
      <span class="readout">
        <span class="elapsed mono">{{ todayLabel() }}</span>
        <span class="since">out at {{ lastOutLabel() }}</span>
      </span>
    } @else {
      <span class="readout">
        <span class="elapsed off">Not checked in</span>
        <span class="since">Start your day</span>
      </span>
    }

    <button
      class="punch-btn"
      type="button"
      [disabled]="busy()"
      (click)="punch()"
      [attr.aria-label]="buttonLabel()"
      [title]="buttonLabel()"
    >
      <app-icon [name]="checkedIn() ? 'logout' : 'login'" [strokeWidth]="2" />
      <span class="punch-label">{{ buttonLabel() }}</span>
    </button>
  </div>
}
