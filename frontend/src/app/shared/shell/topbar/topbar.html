<button
  class="nav-toggle"
  type="button"
  (click)="layout.toggle()"
  [attr.aria-label]="layout.isCompact() ? 'Open navigation' : 'Toggle sidebar'"
>
  <app-icon name="menu" />
</button>

<nav class="crumbs" aria-label="Breadcrumb">
  @for (crumb of trail(); track crumb.path) {
    <a [routerLink]="crumb.path">{{ crumb.label }}</a>
    <app-icon name="chevron" class="rot-270 sep" />
  }
  @if (last(); as current) {
    <h1>{{ current.label }}</h1>
  }
</nav>

<span class="spacer"></span>

<app-global-search />

<div class="tools">
  <app-punch-widget />

  <app-notification-menu />

  <app-theme-toggle class="hide-sm" />

  <app-user-menu />
</div>
