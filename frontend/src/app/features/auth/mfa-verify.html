<div class="auth-card">

  <header>
    <h1>Two-factor verification</h1>
    <p class="muted">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  </header>

  @if (!hasChallenge()) {
    <div class="alert">
      Your sign-in session expired. <a routerLink="/auth/login">Sign in again</a>.
    </div>
  } @else {
    @if (errorMessage()) {
      <div class="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="code">Authentication code</label>
        <input
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          formControlName="code"
          placeholder="123456 or XXXX-XXXX"
          autofocus
        />
      </div>

      <button class="btn block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Verifying…' : 'Verify' }}
      </button>
    </form>

    <footer>
      <a href="javascript:void(0)" (click)="cancel()">Back to sign in</a>
    </footer>
  }
</div>
