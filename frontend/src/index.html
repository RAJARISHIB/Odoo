<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HRMS Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Attendance, people and time off for your organization.">
  <meta name="color-scheme" content="light dark">

  <!-- Locked down to what the SPA actually needs. `connect-src` allowlists both
       the local dev hosts and any https/wss host so this file does not need a
       per-environment build step; narrow it to the exact production API/WS
       origin once those are final. The inline theme script below is allowed by
       hash, not 'unsafe-inline', so no other inline script can execute even if
       something manages to inject one. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'sha256-QxQivwmi5kZ0QB/JOuETD97ROtqqpa0tKVgTJ27nDqA=';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self' http://localhost:8000 ws://localhost:4000 https: wss:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
  ">

  <script>
    /* Applies the stored theme before first paint, so a pinned dark theme does
       not flash light on every load. Keep 'hrms.theme' in sync with STORAGE_KEY
       in src/app/core/services/theme.ts. */
    (function () {
      try {
        var t = localStorage.getItem('hrms.theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    })();
  </script>

  <!-- crossorigin is required even same-origin: fonts are always fetched in
       CORS mode, and omitting it downloads the file twice. -->
  <link rel="preload" href="/fonts/plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
